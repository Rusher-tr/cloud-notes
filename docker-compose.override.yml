# LOCAL DEVELOPMENT ONLY - merged automatically by `docker compose up`.
# Builds the images from source and adds a throwaway Postgres container that stands in for RDS.
# This file is never copied to the cloud hosts.

services:
  web:
    build: ./web

  app:
    build: ./app
    environment:
      DB_USER: notes
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-local-dev-only}
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
