# Web tier: serves the static UI and reverse-proxies /api/ to the app container.
# The app container is NOT published on the host - Nginx is its only entry point.

server {
    listen 8080;                 # unprivileged port; host maps 80 -> 8080
    server_name _;
    server_tokens off;           # hide Nginx version
    client_max_body_size 64k;    # notes are small; reject oversized bodies early

    # Docker's embedded DNS; re-resolve "app" so restarts/redeploys are picked up
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:5000;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    root /usr/share/nginx/html;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # add_header here replaces the server-level ones, so repeat what matters for JSON
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
