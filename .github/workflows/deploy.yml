# CI/CD: test -> build & push images to Amazon ECR -> deploy to the EC2 Auto Scaling Group.
#
# Security: there are NO AWS access keys in GitHub. The workflow gets short-lived
# credentials by assuming an IAM role through GitHub's OIDC provider, and that role
# trusts only the main branch of this repository (see infra/iam.tf).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a deployment half-way

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------- 1. TEST
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres: # throwaway database for integration tests
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notes
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes -d notes"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Run API tests against PostgreSQL
        working-directory: app
        env:
          DB_HOST: localhost
          DB_USER: notes
          DB_PASSWORD: test-only-password
          DB_NAME: notes
          DB_SSLMODE: disable
        run: pytest -v

      - name: Validate docker-compose files
        run: docker compose config --quiet

      - name: Build images (smoke test, no push)
        run: |
          docker build -t notes-web:ci ./web
          docker build -t notes-app:ci ./app

  # ---------------------------------------------------------------- 2. BUILD & PUSH
  build-push:
    name: Build & push to ECR
    needs: test
    if: github.event_name != 'pull_request' # PRs are tested but never deployed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC -> AWS

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_WEB_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_WEB_REPOSITORY }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: APP_VERSION=${{ env.IMAGE_TAG }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_APP_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_APP_REPOSITORY }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  # ---------------------------------------------------------------- 3. DEPLOY
  deploy:
    name: Deploy to EC2 (SSM)
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out new images on every in-service instance
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |
          set -euo pipefail
          IDS=$(aws autoscaling describe-auto-scaling-groups \
                  --auto-scaling-group-names "$ASG_NAME" \
                  --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
                  --output text)
          if [ -z "$IDS" ] || [ "$IDS" = "None" ]; then
            echo "::warning::No in-service instances yet - new instances pull :latest when they boot."
            exit 0
          fi
          echo "Deploying $IMAGE_TAG to: $IDS"

          CMD_ID=$(aws ssm send-command \
                    --instance-ids $IDS \
                    --document-name AWS-RunShellScript \
                    --comment "deploy ${IMAGE_TAG:0:7}" \
                    --parameters "commands=[\"/opt/notes/deploy.sh $IMAGE_TAG\"]" \
                    --timeout-seconds 600 \
                    --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          FAILED=0
          for ID in $IDS; do
            for i in $(seq 1 60); do            # up to 5 minutes per instance
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
                         --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in
                Success) echo "✅ $ID deployed"; break ;;
                Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                  echo "❌ $ID: $STATUS"; FAILED=1; break ;;
                *) sleep 5 ;;
              esac
            done
            [ "$STATUS" = "Success" ] || FAILED=1
            echo "----- output from $ID -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 30 || true
          done
          exit $FAILED

      - name: Smoke test through the load balancer
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$APP_URL/api/health" && curl -fsS "$APP_URL/api/ready"; then
              echo; echo "Live version:"; curl -fsS "$APP_URL/api/info"; echo
              exit 0
            fi
            echo "not ready yet ($i/12)"; sleep 10
          done
          echo "::error::Smoke test failed"; exit 1
